[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax, B likely bugs, SIM simplifications.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
# `scripts` has no __init__.py but is imported as `scripts.<name>`; resolve it from the repo root.
mypy_path = "."
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type stubs.
module = ["sklearn.*", "scipy.*", "torch_geometric.*", "transformers.*", "faiss.*", "matplotlib.*", "nltk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
